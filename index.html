<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Спечи кексик для Коннора</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#120b10;--card:rgba(25,14,20,.88);--fg:#fbefe3;--ac:#c9374d}
@media (prefers-color-scheme:dark){:root{--bg:#120b10}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
#stage{position:relative;width:100%;height:100%;background:#000 center top/contain no-repeat;transition:background-image .4s;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
#stage.game{cursor:default;background-size:cover;background-position:center;filter:none}
#stage.game::before{content:"";position:absolute;inset:0;background:rgba(10,5,8,.62);backdrop-filter:blur(4px)}
#bubble{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);width:min(88%,430px);background:#fff8ee;color:#2a1a16;padding:14px 18px;border-radius:22px;font-size:clamp(15px,3.6vw,19px);line-height:1.4;box-shadow:0 8px 28px #0008;animation:fl 3.2s ease-in-out infinite;z-index:3;display:none}
#bubble::after{content:"";position:absolute;top:-14px;left:22%;border:14px solid transparent;border-bottom-color:#fff8ee;border-top:0}
@keyframes fl{50%{transform:translate(-50%,-8px)}}
#hint{position:absolute;bottom:5%;z-index:3;background:#000a;padding:10px 20px;border-radius:30px;font-size:16px;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.45}}
#title{position:absolute;top:4%;z-index:3;font-size:clamp(20px,5vw,32px);text-shadow:0 2px 12px #000;text-align:center;padding:0 12px}
#panel{position:relative;z-index:4;width:min(96%,640px);max-height:94%;overflow:auto;background:var(--card);border:1px solid #ffffff2a;border-radius:20px;padding:14px;margin-bottom:2%;display:none}
#panel h2{margin:0 0 8px;font-size:18px;text-align:center}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ing{background:#3a2430;border:1px solid #ffffff22;color:var(--fg);border-radius:14px;padding:8px 2px;font:inherit;font-size:12px;cursor:pointer;transition:transform .12s}
.ing:hover{transform:translateY(-3px);background:#4d2f3d}.ing:active{transform:scale(.92)}
.ing b{display:block;font-size:30px;font-weight:400}
#bowl{margin:10px 0;min-height:70px;border:2px dashed #ffffff44;border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:4px;font-size:26px;align-items:center;justify-content:center}
#bowl.mix{animation:sh .25s infinite}
@keyframes sh{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--ac);color:#fff;border:0;border-radius:24px;padding:11px 20px;font:inherit;font-size:16px;cursor:pointer}
.btn.alt{background:#4a3a42}.btn:disabled{opacity:.4;cursor:default}
.bar{position:relative;height:30px;background:#2a1c22;border-radius:15px;overflow:hidden;margin:12px 0}
.zone{position:absolute;top:0;bottom:0;left:50%;width:30%;background:#4caf5066;border-left:2px solid #6c6;border-right:2px solid #6c6}
#fill{height:100%;width:0;background:linear-gradient(90deg,#e8a33d,#d9542a)}
.center{text-align:center}.big{font-size:56px}
#tray{font-size:44px;margin:12px 0}
#end{position:absolute;bottom:4%;z-index:5;display:none;flex-direction:column;align-items:center;gap:10px}
#end .btn{box-shadow:0 4px 16px #000a}
#stage.wolf{animation:rg .09s infinite}
@keyframes rg{25%{transform:translate(-3px,2px)}75%{transform:translate(3px,-2px)}}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:9;background:#000a;color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}
</style></head><body>
<button id="mute" title="Звук">🔊</button>
<div id="stage">
 <div id="title"></div><div id="bubble"></div><div id="hint"></div>
 <div id="panel"></div>
 <div id="end"></div>
</div>
<script>
const IMG={castle:"images/castle.jpg",kitchen:"images/kitchen.jpg",happy:"images/connor-happy.jpg",wolf:"images/connor-wolf.jpg"};
const $=id=>document.getElementById(id),st=$('stage');
let AC,muted=false;
function ac(){if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.15,t0=0,f2){if(muted||!ac())return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,v=.1,fr=800){if(muted||!ac())return;const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;fl.type='bandpass';fl.frequency.value=fr;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);s.connect(fl).connect(g).connect(AC.destination);s.start()}
const pop=()=>tone(500,.12,'sine',.2,0,900),yuck=()=>tone(220,.35,'sawtooth',.12,0,90),
 ding=()=>{tone(1200,.8,'sine',.2);tone(1800,.6,'sine',.1,.05)},
 fan=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.2,i*.15)),
 stir=()=>{for(let i=0;i<6;i++)setTimeout(()=>noise(.18,.12,500+i*80),i*180)};
function growl(){if(muted||!ac())return;const t=AC.currentTime,o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.linearRampToValueAtTime(48,t+2.6);l.frequency.value=26;lg.gain.value=.5;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.45,t+.3);g.gain.setValueAtTime(.45,t+2.1);g.gain.linearRampToValueAtTime(.0001,t+2.8);l.connect(lg).connect(g.gain);o.connect(g).connect(AC.destination);o.start(t);l.start(t);o.stop(t+2.9);l.stop(t+2.9);noise(2.4,.25,300)}
$('mute').onclick=e=>{e.stopPropagation();muted=!muted;e.target.textContent=muted?'🔇':'🔊'};

const ING=[
 ['🌾','Борошно',1,'flour'],['🍬','Цукор',1,'sugar'],['🥚','Яйця',1,'egg'],['🧈','Масло',1,'butter'],
 ['🍫','Шоколад',1],['🍓','Полуниця',1],['🟤','Кориця',1],['🥛','Молоко',1],
 ['🌶️','Гострий перець',0],['🪱','Хробаки',0],['🐛','Жучки',0],['🧅','Цибуля',0],
 ['🧦','Шкарпетка',0],['🕷️','Павук',0],['🧂','Ціла сіль',0],['🐟','Оселедець',0]];
let bowl=[],mixed=false,baking=0,iv=null,bakeOk=false;
const show=(bg,cls='')=>{st.style.backgroundImage=`url(${IMG[bg]})`;st.className=cls};
const setUI=(t,b,h)=>{$('title').textContent=t||'';const bu=$('bubble');bu.style.display=b?'block':'none';bu.innerHTML=b||'';$('hint').style.display=h?'block':'none';$('hint').textContent=h||'';$('panel').style.display='none';$('end').style.display='none'};
let step=0;
function start(){step=0;bowl=[];mixed=false;show('castle');setUI('Спечи кексик для Коннора','','Натисни на замок, щоб зайти 🏰')}
st.onclick=e=>{if(e.target.closest('#panel,#end,#mute'))return;ac();
 if(step===0){step=1;show('kitchen');pop();setUI('','Мене звати Коннор О’Дойл. Я тут метрдотель — і я <b>голодний</b>. Спечи мені кексики. Тільки, будь ласка, <i>смачні</i>… 😒','Натисни, щоб почати');}
 else if(step===1){step=2;show('kitchen','game');pop();cook()}};
function cook(){setUI('🧁 Кухня Коннора','','');bowl=[];mixed=false;$('bubble').style.display='none';
 const p=$('panel');p.style.display='block';
 p.innerHTML=`<h2>1. Клади інгредієнти в миску</h2><div class="shelf">${ING.map((x,i)=>`<button class="ing" data-i="${i}"><b>${x[0]}</b>${x[1]}</button>`).join('')}</div>
 <div id="bowl"><span style="font-size:14px;opacity:.6">миска порожня</span></div>
 <div class="row"><button class="btn alt" id="clr">Очистити</button><button class="btn" id="mx" disabled>🥄 Змішати</button></div>`;
 p.querySelectorAll('.ing').forEach(b=>b.onclick=()=>{const x=ING[b.dataset.i];bowl.push(x);mixed=false;x[2]?pop():yuck();renderBowl()});
 $('clr').onclick=()=>{bowl=[];pop();renderBowl()};
 $('mx').onclick=()=>{$('bowl').classList.add('mix');stir();$('mx').disabled=true;setTimeout(()=>{mixed=true;oven()},1300)}}
function renderBowl(){const b=$('bowl');b.innerHTML=bowl.length?bowl.map(x=>x[0]).join(' '):'<span style="font-size:14px;opacity:.6">миска порожня</span>';$('mx').disabled=bowl.length<2}
function oven(){const p=$('panel');p.innerHTML=`<h2 class="center">2. Духовка</h2><div class="center big">🥣 → 🔥</div><p class="center">Постав форму в духовку. Дістань кексики, коли шкала в <b style="color:#7d7">зеленій зоні</b>!</p><div class="row"><button class="btn" id="go">Поставити в духовку</button></div>`;
 $('go').onclick=()=>{p.innerHTML=`<h2 class="center">🔥 Печеться…</h2><div class="center big">🧁</div><div class="bar"><div class="zone"></div><div id="fill"></div></div><div class="row"><button class="btn" id="out">Дістати!</button></div>`;
  let t0=Date.now(),dur=6000;noise(.4,.15,200);
  iv=setInterval(()=>{const r=(Date.now()-t0)/dur;$('fill').style.width=Math.min(r*100,100)+'%';if(Math.random()<.15)noise(.1,.04,2500);if(r>=1)take()},40);
  $('out').onclick=take;
  function take(){clearInterval(iv);const r=(Date.now()-t0)/dur;bakeOk=r>=.5&&r<=.8;ding();tray()}}}
function tray(){const p=$('panel');p.innerHTML=`<h2 class="center">3. Виставляємо на тацю</h2><div class="center" id="tray"></div><div class="row"><button class="btn" id="put">Виставити кексики на тацю</button></div>`;
 $('put').onclick=()=>{const bad=bowl.some(x=>!x[2]),need=['flour','sugar','egg','butter'].some(k=>!bowl.some(x=>x[3]===k)),burnt=!bakeOk;
  const good=!bad&&!need&&!burnt;let n=0;const T=$('tray');$('put').disabled=true;
  const e=setInterval(()=>{T.textContent+=(good?'🧁':(bad?'💩':'🖤'))+' ';pop();if(++n>=4){clearInterval(e);setTimeout(()=>finish(good,bad,need,burnt),900)}},350)}}
function finish(good,bad,need,burnt){
 if(good){show('happy');fan();setUI('Коннор задоволений 😌','Мммм… Неймовірно. Ти заслужила спокійний вечір. Залишайся: кексики, гаряче какао і <b>гарна книжечка</b> біля каміна 📖🕯️','');
  endBtns('Спекти ще раз')}
 else{show('wolf','wolf');growl();const why=bad?'Ти поклала в тісто якусь гидоту!':need?'Без борошна, цукру, яєць і масла кексика не буде!':'Кекси згоріли або недопеклися!';
  setUI('Ґррррр!!! 🐺','<b>ҐРРРРР!</b> '+why+' Тікай!','');setTimeout(()=>st.classList.remove('wolf'),2600);endBtns('Спробувати ще раз')}}
function endBtns(t){const e=$('end');e.style.display='flex';e.innerHTML=`<button class="btn" id="again">${t}</button>`;$('again').onclick=ev=>{ev.stopPropagation();step=2;show('kitchen','game');cook()}}
start();
</script></body></html>
